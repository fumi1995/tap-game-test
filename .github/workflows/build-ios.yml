name: Unity iOS Free Build

on:
  workflow_dispatch:

jobs:
  unity-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Unity Build iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS

      - name: Upload Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: build/iOS

  xcode-build:
    needs: unity-build
    runs-on: macos-26

    steps:
      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: ios-project
          path: ios-build

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build WITHOUT signing
        run: |
          cd ios-build
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Zip built .app
        run: |
          cd ios-build/build/Release-iphoneos
          zip -r Unity-iPhone-app.zip Unity-iPhone.app

      - name: Upload .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-app
          path: ios-build/build/Release-iphoneos/Unity-iPhone-app.zip
